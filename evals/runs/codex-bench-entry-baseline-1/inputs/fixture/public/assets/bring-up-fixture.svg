<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">Explanatory bring-up relationships</title>
  <desc id="desc">A firmware command reaches a generic board; the bring-up fixture makes a response available to bench instruments. This is not a photograph, circuit diagram, wiring plan or measured result.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70551b"/></marker></defs>
  <rect width="720" height="620" rx="12" fill="#faf7ec"/>
  <g font-family="system-ui, sans-serif" fill="#282a27">
    <text x="42" y="54" font-size="30" font-weight="700">Checking basic operation</text>
    <text x="42" y="88" font-size="22">Relationships only, with no circuit detail</text>
    <g fill="#fffdf5" stroke="#70551b" stroke-width="3">
      <rect x="130" y="124" width="460" height="72" rx="6"/>
      <rect x="130" y="236" width="460" height="72" rx="6"/>
      <rect x="130" y="348" width="460" height="72" rx="6"/>
      <rect x="130" y="460" width="460" height="72" rx="6"/>
    </g>
    <g font-family="ui-monospace, monospace" font-size="27" text-anchor="middle">
      <text x="360" y="170">Firmware command</text>
      <text x="360" y="282">Generic board</text>
      <text x="360" y="394">Bring-up fixture</text>
      <text x="360" y="506">Bench observation</text>
    </g>
    <g stroke="#70551b" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M360 197 V222"/><path d="M360 309 V334"/><path d="M360 421 V446"/>
    </g>
    <text x="42" y="576" font-size="22">Explanatory schematic, not a photograph</text>
    <text x="42" y="603" font-size="22">or a circuit diagram.</text>
  </g>
</svg>
