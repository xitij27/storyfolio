<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">Teaching loop label: Measure</title><desc id="desc">Adaptation of the supplied power-state teaching drawing for a solid fixture label. Sleep, Measure, Transmit; no actual firmware states, durations or current values claimed.</desc>
<rect width="900" height="350" fill="#edf0e8"/><path d="M0 0h14v350H0z" fill="#8d471e"/>
<g font-family="monospace"><text x="45" y="76" fill="#8d471e" font-size="56">TEACHING LOOP</text><text x="42" y="206" fill="#202932" font-size="108" font-weight="600">Measure</text><text x="45" y="270" fill="#202932" font-size="39">Sleep → Measure → Transmit → Sleep</text><text x="45" y="325" fill="#58636c" font-size="35">No durations or current values</text></g></svg>
