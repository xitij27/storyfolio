<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">Explanatory power-state loop</title>
  <desc id="desc">Sleep leads to Measure, then Transmit, then back to Sleep. These are fictional teaching labels, not actual firmware state names, measured timing or current values.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70551b"/></marker></defs>
  <rect width="720" height="620" rx="12" fill="#faf7ec"/>
  <g font-family="system-ui, sans-serif" fill="#282a27">
    <text x="42" y="54" font-size="30" font-weight="700">A simplified scheduling loop</text>
    <text x="42" y="88" font-size="22">An explanatory model for this fictional story</text>
    <g fill="#fffdf5" stroke="#70551b" stroke-width="3">
      <rect x="135" y="132" width="410" height="92" rx="6"/>
      <rect x="135" y="292" width="410" height="92" rx="6"/>
      <rect x="135" y="452" width="410" height="92" rx="6"/>
    </g>
    <g font-family="ui-monospace, monospace" font-size="32" font-weight="600" text-anchor="middle">
      <text x="340" y="189">Sleep</text>
      <text x="340" y="349">Measure</text>
      <text x="340" y="509">Transmit</text>
    </g>
    <g stroke="#70551b" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M340 225 V278"/>
      <path d="M340 385 V438"/>
      <path d="M546 498 H625 V178 H560"/>
    </g>
    <text x="42" y="590" font-size="22">No durations, current values or actual code shown.</text>
  </g>
</svg>
