<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ada Mensah: firmware and the bench</title>
  <desc id="desc">A static six-row motif beside Ada Mensah's name and the question: How does a firmware decision become a measurable signal?</desc>
  <rect width="1200" height="630" fill="#faf7ec"/>
  <g stroke="#70551b" stroke-width="3" fill="#fffdf5">
    <rect x="790" y="112" width="330" height="48"/><rect x="790" y="178" width="330" height="48"/>
    <rect x="790" y="244" width="330" height="48"/><rect x="790" y="310" width="330" height="48"/>
    <rect x="790" y="376" width="330" height="48"/><rect x="790" y="442" width="330" height="48"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#282a27">
    <text x="72" y="168" font-size="66" font-weight="700">Ada Mensah</text>
    <text x="76" y="237" font-size="35">Firmware and the bench</text>
    <text x="76" y="346" font-size="32">How does a firmware decision</text>
    <text x="76" y="391" font-size="32">become a measurable signal?</text>
    <text x="76" y="544" font-size="23">State by state</text>
  </g>
</svg>
