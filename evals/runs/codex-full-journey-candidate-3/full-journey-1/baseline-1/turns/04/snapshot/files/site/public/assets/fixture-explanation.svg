<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="t d"><title id="t">Conceptual bring-up fixture</title><desc id="d">Six solid contact modules labelled Code, State, Board, Access, Signal and Claim. This original explanatory drawing represents relationships, not actual hardware, wiring or measured evidence.</desc><rect width="720" height="460" rx="16" fill="#f2f0e9"/><g font-family="system-ui,sans-serif" fill="#202932"><text x="35" y="45" font-size="24">Code → bench access → physical observation</text><text x="35" y="423" font-size="18">Explanatory geometry · no actual wiring or measurements</text></g><defs><g id="m"><rect width="190" height="100" rx="4" fill="#263c3a"/><rect x="10" y="17" width="170" height="66" fill="#f9f5e9"/><path d="M40 0v-22m110 22v-22" stroke="#cba95d" stroke-width="12"/></g></defs><g transform="translate(40 120)"><use href="#m"/><use href="#m" x="225"/><use href="#m" x="450"/><use href="#m" y="155"/><use href="#m" x="225" y="155"/><use href="#m" x="450" y="155"/><g fill="#202932" font-family="monospace" font-size="26" font-weight="700" text-anchor="middle"><text x="95" y="59">CODE</text><text x="320" y="59">STATE</text><text x="545" y="59">BOARD</text><text x="95" y="214">ACCESS</text><text x="320" y="214">SIGNAL</text><text x="545" y="214">CLAIM</text></g></g></svg>
