<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">One story, carried by the same pages</title>
  <desc id="description">A concept illustration for Storyfolio. Five paper pieces begin as a stack, spread into a method diagram, hang as a project wall, and gather into a complete paper at the close. A continuous line links all four chapters.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ded6ca"/>
    </pattern>
    <g id="page">
      <rect x="0" y="6" width="76" height="96" rx="5" fill="#302e28" opacity=".08"/>
      <rect width="76" height="96" rx="5" fill="#fffdf8" stroke="#b8afa0" stroke-width="1.5"/>
      <rect x="12" y="14" width="22" height="5" rx="2" fill="#d16a45"/>
      <path d="M12 30h50M12 39h50M12 48h36" fill="none" stroke="#c8c1b5" stroke-width="3" stroke-linecap="round"/>
      <rect x="12" y="61" width="52" height="22" rx="3" fill="#eee9df"/>
      <path d="m19 76 10-7 10 4 13-9 6 4" fill="none" stroke="#71796c" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f7f3eb"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)" opacity=".65"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="49" fill="#737163" font-size="13" font-weight="700" letter-spacing="2">STORYFOLIO / THE IDEA</text>
    <text x="52" y="104" fill="#292c26" font-size="40" font-weight="700">Your work gives the story its shape.</text>
    <text x="52" y="137" fill="#65665c" font-size="18">A paper's pages become the chapters of a portfolio.</text>
    <rect x="936" y="32" width="212" height="30" rx="15" fill="#e9e3d7"/>
    <text x="1042" y="52" text-anchor="middle" fill="#65665c" font-size="12" letter-spacing="1">CONCEPT ILLUSTRATION</text>
    <path d="M66 322C129 375 197 373 258 322S417 253 506 304 648 365 721 322 885 265 965 307 1070 351 1134 314" fill="none" stroke="#d16a45" stroke-width="2.5" stroke-dasharray="5 7" opacity=".6"/>
    <!-- Opening: five pages gather in a single stack. -->
    <ellipse cx="178" cy="341" rx="85" ry="19" fill="#e4ddcf"/>
    <use href="#page" transform="translate(102 261) matrix(.9 -.18 .4 .55 0 0)"/>
    <use href="#page" transform="translate(108 249) matrix(.9 -.18 .4 .55 0 0)"/>
    <use href="#page" transform="translate(114 237) matrix(.9 -.18 .4 .55 0 0)"/>
    <use href="#page" transform="translate(120 225) matrix(.9 -.18 .4 .55 0 0)"/>
    <use href="#page" transform="translate(126 213) matrix(.9 -.18 .4 .55 0 0)"/>
    <!-- Method: the same five pages form a connected diagram. -->
    <ellipse cx="454" cy="351" rx="91" ry="17" fill="#e4ddcf"/>
    <path d="m409 280 49-54 48 55-48 51Z M458 226v106 M409 280h97" fill="none" stroke="#8c9986" stroke-width="2.5"/>
    <use href="#page" transform="translate(437 192) scale(.55)"/>
    <use href="#page" transform="translate(387 250) scale(.55)"/>
    <use href="#page" transform="translate(436 250) scale(.55)"/>
    <use href="#page" transform="translate(487 250) scale(.55)"/>
    <use href="#page" transform="translate(437 309) scale(.55)"/>
    <!-- Work: five pages display different projects on their faces. -->
    <ellipse cx="747" cy="351" rx="104" ry="17" fill="#e4ddcf"/>
    <use href="#page" transform="translate(646 205) skewY(-8) scale(.65)"/>
    <use href="#page" transform="translate(710 205) skewY(-8) scale(.65)"/>
    <use href="#page" transform="translate(774 205) skewY(-8) scale(.65)"/>
    <use href="#page" transform="translate(678 291) skewY(-8) scale(.65)"/>
    <use href="#page" transform="translate(742 291) skewY(-8) scale(.65)"/>
    <path d="M655 253h31M719 253l8-15 8 10 11-21M784 242h10v12h-10m15-20h10v20h-10" fill="none" stroke="#d16a45" stroke-width="2"/>
    <!-- Close: the five pages gather back into a complete paper. -->
    <ellipse cx="1024" cy="351" rx="85" ry="17" fill="#e4ddcf"/>
    <use href="#page" transform="translate(984 254) matrix(.9 -.18 .4 .55 0 0)"/>
    <use href="#page" transform="translate(988 242) matrix(.9 -.18 .4 .55 0 0)"/>
    <use href="#page" transform="translate(992 230) matrix(.9 -.18 .4 .55 0 0)"/>
    <use href="#page" transform="translate(996 218) matrix(.9 -.18 .4 .55 0 0)"/>
    <use href="#page" transform="translate(1000 206) matrix(.9 -.18 .4 .55 0 0)"/>
    <circle cx="1057" cy="253" r="14" fill="#69765f"/>
    <path d="m1051 253 4 4 8-9" fill="none" stroke="#fffdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#292c26" font-size="18" font-weight="700" text-anchor="middle">
      <text x="178" y="403">01 / Opening</text>
      <text x="454" y="403">02 / Method</text>
      <text x="747" y="403">03 / Projects</text>
      <text x="1024" y="403">04 / Close</text>
    </g>
    <g fill="#65665c" font-size="15" text-anchor="middle">
      <text x="178" y="429">Where your story starts</text>
      <text x="454" y="429">How you work</text>
      <text x="747" y="429">What you have made</text>
      <text x="1024" y="429">What it adds up to</text>
    </g>
    <path d="M52 464h1096" stroke="#ded6ca"/>
    <text x="52" y="496" fill="#737163" font-size="14">The same object. A new arrangement in each chapter. One continuous scroll.</text>
    <text x="1148" y="496" text-anchor="end" fill="#737163" font-size="14">Current skill: plan → storyboard</text>
  </g>
</svg>
